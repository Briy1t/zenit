<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/static/img/cohete.png">
    <meta charset="UTF-8">
    <title>Cuestionario ZENIT</title>
    <link rel="stylesheet" href="/static/cuestionario.css">
</head>

<body>

<div class="layout">

    <!-- COLUMNA IZQUIERDA: FORMULARIO -->
    <div class="col-form">
        <div class="contenedor">

            <h1>Cuestionario <span class="ze">ZE</span><span class="nit">NIT</span></h1>

            <form action="/cuestionario" method="post">

                <input type="hidden" name="usuario_id" value="{{ usuario_id }}">

                <!-- ENERGÍA SOCIAL -->
                <label>🗣️ Energía Social (1 a 10)</label>
                <input type="number" name="energia_social" min="1" max="10" required>

                <!-- ENERGÍA FÍSICA -->
                <label>🏃‍♀️ Energía Física (1 a 10)</label>
                <input type="number" name="energia_fisica" min="1" max="10" required>

                <!-- SEÑALES DEL CUERPO -->
                <label>🧠 Señales del cuerpo</label>
                <select name="senales" required>
                    <option value="">Selecciona una opción</option>
                    <option>Dolor de cabeza</option>
                    <option>Cansancio</option>
                    <option>Palpitaciones</option>
                    <option>Tensión muscular</option>
                    <option>Estómago revuelto</option>
                    <option>Respiración acelerada</option>
                    <option>Tranquil@</option>
                    <option>Neutr@</option>
                    <option>Estable</option>
                    <option>Energética</option>
                </select>

                <!-- DRENANTES -->
                <label>⚡ Drenantes (si no hubo, deja vacío)</label>
                <textarea name="drenantes" placeholder="Ej: ruido, discusiones, estrés..."></textarea>

                <!-- REGULADORES -->
                <label>🌿 Reguladores (separados por coma)</label>
                <textarea name="reguladoras" placeholder="Ej: caminar, música, respirar..."></textarea>

                <!-- EMOCIÓN DEL DÍA -->
                <label>💛 Emoción del día</label>
                <select name="emocion" required>
                    <option value="">Selecciona una emoción</option>
                    <option>Triste</option>
                    <option>Ansiosa</option>
                    <option>Irritable</option>
                    <option>Estresada</option>
                    <option>Cansada</option>
                    <option>Neutra</option>
                    <option>Tranquila</option>
                    <option>En paz</option>
                    <option>Alegre</option>
                    <option>Motivada</option>
                </select>

                <!-- NECESIDADES -->
                <label>📝 Necesidades (recordatorio personal)</label>
                <textarea name="necesidades" placeholder="Ej: descansar, hidratarme, salir a caminar..."></textarea>

                <button type="submit">Guardar Registro</button>
            </form>

        </div>
    </div>
    
    <!-- COLUMNA DERECHA: COHETE + DIARIO -->
    <div class="col-gota">
        <div class="panel-derecho">

            <div class="gota-container">
                
                <!-- GOTA -->
                <svg class="gota-svg" viewBox="0 0 100 160">
                    <defs>
                        <clipPath id="clip-gota">
                            <path d="
                                M50 5
                                C65 30 80 60 80 95
                                C80 125 67 150 50 155
                                C33 150 20 125 20 95
                                C20 60 35 30 50 5
                                Z
                            " />
                        </clipPath>

                        <linearGradient id="grad-gota" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0%" stop-color="#4cc9f0"/>
                            <stop offset="100%" stop-color="#7209b7"/>
                        </linearGradient>
                    </defs>

                    <rect id="gota-fill"
                        x="20" y="155"
                        width="60" height="0"
                        fill="url(#grad-gota)"
                        clip-path="url(#clip-gota)" />

                    <path d="
                        M50 5
                        C65 30 80 60 80 95
                        C80 125 67 150 50 155
                        C33 150 20 125 20 95
                        C20 60 35 30 50 5
                        Z
                    " fill="none" stroke="#1b263b" stroke-width="3"/>

                    <path id="ojo-izq" d="M38 90 C40 88 42 88 44 90" stroke="#1b263b" stroke-width="2"/>
                    <path id="ojo-der" d="M56 90 C58 88 60 88 62 90" stroke="#1b263b" stroke-width="2"/>
                    <path id="boca" d="M40 102 C45 108 55 108 60 102" stroke="#1b263b" stroke-width="2"/>
                </svg>

                <!-- TIP DEL DÍA -->
                <div class="tip-dia">
                    <h2>Tip del día</h2>
                    <p>{{ tip_del_dia }}</p>
                </div>

                <!-- DIARIO PERSONAL -->
                <div class="diario-card">
                    <h2>📓 Diario personal</h2>
                    <textarea 
                        id="diario-texto" 
                        name="diario_texto"
                        maxlength="600" 
                        placeholder="Escribe lo que sientes hoy... (máx. 100 palabras)"
                        oninput="guardarDiario()"
                    ></textarea>
                </div>

                <!-- DIBUJO -->
                <div class="diario-dibujo">
                    <p>Dibuja aquí:</p>
                    <canvas id="canvas-dibujo"></canvas>
                    <button id="limpiar-dibujo">Limpiar</button>
                    <button id="descargar-dibujo">Descargar dibujo</button>
                </div>

            </div>
        </div>
    </div>

</div>

<!-- SCRIPT PARA GUARDAR EL DIARIO -->
<script>
function guardarDiario() {
    const texto = document.getElementById("diario-texto").value;

    fetch("/guardar_diario", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `usuario_id={{ usuario_id }}&texto=${encodeURIComponent(texto)}`
    });
}
</script>

<script src="/static/gota.js"></script>
<script src="/static/diario.js"></script>

</body>
</html>
